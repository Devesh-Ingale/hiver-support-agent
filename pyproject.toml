[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-agent"
version = "0.1.0"
description = "AI customer-support agent for one Twitter brand, with the evaluation harness that proves how well it works."
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "pyarrow",
    "scikit-learn",
    "scipy",
    "matplotlib",
    "seaborn",
    "pydantic>=2",
    "pyyaml",
    "requests",
    "ollama",
    "google-genai",
    "kaggle",
    "rank_bm25",
    "langdetect",
    "rapidfuzz",
    "tqdm",
    "joblib",
    "python-dotenv",
]

[project.scripts]
support-agent = "support_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
